version: '3'

services:
  kali:
    build:
      context: .
      dockerfile: kali.dockerfile
    command: |
      "sleep 10"
      "curl bwapp/install.php?install=yes"
    depends_on:
      - bwapp
    volumes:
      - /mnt/share-kali:/share
      - ./app:/root/app
      - ./cves:/root/cves
      - ./db:/root/db
  bwapp:
    image: "raesene/bwapp"
    hostname: bwapp
    expose:
      - 80

