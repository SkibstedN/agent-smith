services:
  ollama:
    image: ollama/ollama:0.1.34
    volumes: [ "ollama-models:/root/.ollama" ]
    ports: [ "11434:11434" ]

  agent-smith:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: [ ollama ]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    volumes:
      - ./logs:/logs
    ports: [ "8000:8000" ]

  bwapp:
    image: raesene/bwapp
    ports: [ "8080:80", "3306:3306" ]

volumes:
  ollama-models:
